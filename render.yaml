services:
  - type: web
    name: almacenando-api
    runtime: node
    region: oregon
    plan: free

    # -----------------------------------------------------------------------
    # Build Command
    # -----------------------------------------------------------------------
    # Nota: pnpm v10 reintroducido porque v11 tiene un bug con onlyBuiltDependencies
    buildCommand: >
      pnpm install --no-frozen-lockfile &&
      BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/legado build &&
      pnpm --filter @workspace/api-server build &&
      pnpm --filter @workspace/db migrate

    startCommand: node artifacts/api-server/dist/index.cjs

    # Health check — Render pings /api/healthz every 30s.
    # If it fails 3 consecutive times, the service restarts.
    healthCheckPath: /api/healthz

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false          # PostgreSQL Internal URL del dashboard de Render

      # ⚠️ CRITICO: USA sync:false Y PON UN VALOR FIJO EN EL DASHBOARD
      # Si usas generateValue:true, Render cambia el secret en cada deploy
      # y bota a todos los usuarios de sesión. Genera uno con:
      # node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      - key: SESSION_SECRET
        sync: false

      - key: APP_URL
        sync: false          # Ej: https://almacenando.onrender.com

      - key: LOG_LEVEL
        value: info

      # SMTP Gmail — notificaciones internas del almacén
      - key: SMTP_EMAIL
        sync: false          # Ej: almacen@tuempresa.com
      - key: SMTP_APP_PASSWORD
        sync: false          # App Password de Google

      # Google Drive
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false          # JSON completo de la cuenta de servicio
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false          # ID de la carpeta en Drive

      # Cloudinary (opcional)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Admin bootstrap (solo primer deploy)
      - key: ADMIN_SETUP_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Resend — emails transaccionales (reset de contraseña)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

      # Notificaciones — destinatarios
      - key: NOTIFY_LOT_CHANGE
        sync: false
      - key: NOTIFY_PRODUCT_OUT
        sync: false
      - key: NOTIFY_PRODUCT_OUT_CC
        sync: false
      - key: NOTIFY_STOCK_COLOR
        sync: false
      - key: NOTIFY_STOCK_COLOR_CC
        sync: false
      - key: NOTIFY_STOCK_AUX
        sync: false
      - key: NOTIFY_STOCK_AUX_CC
        sync: false
      - key: NOTIFY_ORDER_APPROVAL
        sync: false
      - key: NOTIFY_PLASTIC_BAG
        sync: false
      - key: NOTIFY_PLASTIC_BAG_CC
        sync: false

      # OpenAI (extracción MSDS)
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false

      # Gemini (compatibilidad química)
      - key: GEMINI_API_KEY
        sync: false
